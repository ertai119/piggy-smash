<h2>화면 흐름: 플레이 → 결과 → 강화 → 다음 스테이지</h2>
<p class="subtitle">플레이 화면의 저금통을 C 시안 그림으로 바꿨어요. 빠진 것이나 바꾸고 싶은 게 있으면 채팅으로 알려주세요.</p>

  </defs>
</svg>

    <div style="font-size:12px;opacity:.7;max-width:230px">저금통마다 머리 위에 체력 바. 금 저금통은 더 크고 반짝이며 체력 바도 길어요.</div>

  <!-- 2. 결과 -->

        <rect x="10" y="216" width="180" height="44" rx="8" fill="#1e3a6e" stroke="#000" stroke-width="2"/>

        <rect x="130" y="226" width="52" height="24" rx="6" fill="#76ff03" stroke="#000" stroke-width="2"/><text x="156" y="242" font-size="10" text-anchor="middle">🪙 700</text>
